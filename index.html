<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Coffee Cup Simulation</title>
<style>
  :root { --fg: #f3ece4; --muted: #b9ada1; --panel: rgba(20, 14, 10, 0.55); --line: rgba(255, 240, 225, 0.14); }
  html, body { margin: 0; height: 100%; background: #0d0907; color: var(--fg); overflow: hidden;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  .ui { position: fixed; left: 16px; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .ui button { pointer-events: auto; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font: inherit; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .ui button:hover { border-color: rgba(255, 240, 225, 0.35); }
  .ui button.off { opacity: 0.5; }
  .ui kbd { font: 11px ui-monospace, monospace; color: var(--muted); margin-left: 6px; }
  .help { position: fixed; top: 16px; left: 16px; max-width: 340px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .help b { color: var(--fg); font-weight: 600; }
  .help summary { cursor: pointer; color: var(--fg); list-style: none; }
  .help summary::-webkit-details-marker { display: none; }
  .help ul { margin: 8px 0 0; padding-left: 18px; }
  #fps { position: fixed; top: 16px; right: 16px; color: var(--muted); font: 11px ui-monospace, monospace; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  #status.err { color: #ffb4a0; }
  @media (max-width: 600px) { .help { right: 16px; max-width: none; } #fps { top: auto; bottom: 64px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Solving for the Bessel modes of the cup…</div>
<details class="help" open>
  <summary><b>Coffee</b> — a physically based liquid</summary>
  <ul>
    <li><b>Drag on the coffee</b> to stir it with the spoon</li>
    <li><b>Tap the coffee</b> to drop a droplet</li>
    <li><b>Drag the cup</b> (or use the arrow keys) to slide it and slosh the coffee</li>
    <li><b>Drag elsewhere</b> to orbit, scroll to zoom</li>
  </ul>
</details>
<div id="fps"></div>
<div class="ui">
  <button id="b-stir">Stir<kbd>S</kbd></button>
  <button id="b-milk">Pour milk<kbd>M</kbd></button>
  <button id="b-sugar">Drop sugar<kbd>D</kbd></button>
  <button id="b-knock">Knock table<kbd>K</kbd></button>
  <button id="b-steam">Steam</button>
  <button id="b-reset">Reset<kbd>R</kbd></button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
